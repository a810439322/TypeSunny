name: Build and Release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'ci: update version info')"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore TypeSunny.sln

      - name: Build Release
        run: msbuild TypeSunny.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content "Version\version.txt" -Raw).Trim()
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Get commit message
        id: commit
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%B | head -1)
          echo "message=$MSG" >> $GITHUB_OUTPUT

      - name: Create packages
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"

          # 全量包：bin/Release 全部内容
          $fullZip = "TypeSunny-${ver}-full.zip"
          Compress-Archive -Path "bin\Release\*" -DestinationPath $fullZip -Force
          echo "Created $fullZip"

          # 更新包：只有根目录下的 exe, dll, xml, pdb, config
          $updateDir = "release-staging\update"
          New-Item -ItemType Directory -Path $updateDir -Force | Out-Null
          Get-ChildItem "bin\Release" -File | Where-Object {
            $_.Extension -in '.exe','.dll','.xml','.pdb','.config'
          } | Copy-Item -Destination $updateDir
          $updateZip = "TypeSunny-${ver}-update.zip"
          Compress-Archive -Path "$updateDir\*" -DestinationPath $updateZip -Force
          echo "Created $updateZip"

      - name: Update update.json
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $msg = (git log -1 --pretty=%s).Trim()
          $msgEscaped = $msg.Replace('\', '\\').Replace('"', '\"').Replace("`r", '').Replace("`n", '\n')
          $json = @"
          {
            "version": "$ver",
            "changelog": "$msgEscaped",
            "update_url": "https://gitee.com/fuchuxuan/TypeSunny/releases/download/v$ver/TypeSunny-${ver}-update.zip",
            "full_url": "https://gitee.com/fuchuxuan/TypeSunny/releases/download/v$ver/TypeSunny-${ver}-full.zip"
          }
          "@
          $json.Trim() | Set-Content -Path "Version\update.json" -Encoding UTF8 -NoNewline

      - name: Commit update.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Version/update.json
          git diff --cached --quiet || git commit -m "ci: update version info to ${{ steps.version.outputs.version }}"
          git push origin master

      - name: Delete existing release and tag
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MSG="${{ steps.commit.outputs.message }}"
          gh release create "v${VERSION}" \
            --title "晴跟打 v${VERSION}" \
            --notes "${MSG}" \
            --target master \
            "TypeSunny-${VERSION}-full.zip" \
            "TypeSunny-${VERSION}-update.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Gitee Release
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MSG="${{ steps.commit.outputs.message }}"

          # 用 jq 构建 JSON，避免特殊字符破坏格式
          PAYLOAD=$(jq -n \
            --arg token "${{ secrets.GITEE_TOKEN }}" \
            --arg tag "v${VERSION}" \
            --arg name "晴跟打 v${VERSION}" \
            --arg body "$MSG" \
            '{access_token: $token, tag_name: $tag, name: $name, body: $body, target_commitish: "master"}')

          echo "Creating Gitee release..."
          RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Response: $RESPONSE"

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create Gitee release"
            exit 1
          fi

          echo "Gitee Release ID: $RELEASE_ID"

          curl -s -X POST \
            "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases/${RELEASE_ID}/attach_files" \
            -H "Content-Type: multipart/form-data" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@TypeSunny-${VERSION}-full.zip"

          curl -s -X POST \
            "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases/${RELEASE_ID}/attach_files" \
            -H "Content-Type: multipart/form-data" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@TypeSunny-${VERSION}-update.zip"

          echo "Gitee release created and files uploaded"
