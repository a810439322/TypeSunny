name: Build and Release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set timezone
        shell: pwsh
        run: tzutil /s "China Standard Time"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore TypeSunny.sln

      - name: Build Release
        run: msbuild TypeSunny.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content "Version\version.txt" -Raw).Trim()
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Get commit message
        shell: pwsh
        run: |
          $msg = (git log -1 --pretty=%B | Out-String).TrimEnd()
          [System.IO.File]::WriteAllText("$PWD\commit_message.txt", $msg, [System.Text.UTF8Encoding]::new($false))
          echo "--- commit_message.txt ---"
          Get-Content "commit_message.txt"

      - name: Create packages
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"

          $fullZip = "TypeSunny-${ver}-full.zip"
          Compress-Archive -Path "bin\Release\*" -DestinationPath $fullZip -Force
          echo "Created $fullZip"

          $updateDir = "release-staging\update"
          New-Item -ItemType Directory -Path $updateDir -Force | Out-Null
          Get-ChildItem "bin\Release" -File | Where-Object {
            $_.Extension -in '.exe','.dll','.xml','.pdb','.config'
          } | Copy-Item -Destination $updateDir
          $updateZip = "TypeSunny-${ver}-update.zip"
          Compress-Archive -Path "$updateDir\*" -DestinationPath $updateZip -Force
          echo "Created $updateZip"

      - name: Delete existing GitHub release
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create "v${VERSION}" \
            --title "晴跟打 v${VERSION}" \
            --notes-file commit_message.txt \
            --target master \
            "TypeSunny-${VERSION}-full.zip" \
            "TypeSunny-${VERSION}-update.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8

          $ver = "${{ steps.version.outputs.version }}"
          $msg = Get-Content "commit_message.txt" -Raw
          $token = $env:GITEE_TOKEN

          echo "=== Gitee Release ==="
          echo "Version: $ver"
          echo "Message: $msg"
          echo "Token length: $($token.Length)"

          function Get-GiteeReleases($token) {
            $all = @()
            $page = 1
            $perPage = 100

            while ($true) {
              $url = "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases?access_token=${token}&page=${page}&per_page=${perPage}"
              $pageReleases = @(Invoke-RestMethod -Uri $url -Method Get)

              if ($pageReleases.Count -eq 0) {
                break
              }

              $all += $pageReleases

              if ($pageReleases.Count -lt $perPage) {
                break
              }

              $page++
            }

            return $all
          }

          function Remove-OldGiteeReleases($token, $keepReleaseCount) {
            $releases = Get-GiteeReleases $token
            $oldReleases = @($releases |
              Sort-Object @{ Expression = { [DateTime]$_.created_at }; Descending = $true } |
              Select-Object -Skip $keepReleaseCount)

            foreach ($rel in $oldReleases) {
              echo "Deleting old Gitee release $($rel.tag_name) (ID $($rel.id), created_at=$($rel.created_at))..."
              Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases/$($rel.id)?access_token=${token}" `
                -Method Delete
              echo "Deleted $($rel.tag_name)"
            }

            echo "Kept latest $keepReleaseCount Gitee releases."
          }

          echo "--- Step 0: Deleting existing release if any ---"
          try {
            $releases = Get-GiteeReleases $token
            foreach ($rel in $releases) {
              if ($rel.tag_name -eq "v$ver") {
                echo "Found existing release ID $($rel.id) with tag v$ver, deleting..."
                Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases/$($rel.id)?access_token=${token}" -Method Delete
                echo "Deleted"
              }
            }
          } catch {
            echo "No existing release found or error: $($_.Exception.Message)"
          }

          echo "--- Step 1: Creating release ---"
          $body = @{
            access_token = $token
            tag_name = "v$ver"
            name = "TypeSunny v$ver"
            body = $msg
            target_commitish = "master"
          } | ConvertTo-Json -Depth 3

          echo "Request body: $body"

          $utf8 = [System.Text.Encoding]::UTF8
          $bodyBytes = $utf8.GetBytes($body)

          try {
            $response = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases" `
              -Method Post -ContentType "application/json; charset=utf-8" `
              -Body $bodyBytes
            echo "Release created successfully"
          } catch {
            echo "ERROR creating release: $($_.Exception.Message)"
            echo "Response: $($_.ErrorDetails.Message)"
            throw
          }

          $releaseId = $response.id
          echo "Gitee Release ID: $releaseId"

          # 上传函数：带重试和计时
          function Upload-Asset($filePath, $releaseId, $token, $maxRetry, $required) {
            $fileName = Split-Path $filePath -Leaf
            echo "--- Uploading $fileName (required=$required) ---"
            echo "File size: $([math]::Round((Get-Item $filePath).Length / 1MB, 2)) MB"

            $uploaded = $false
            for ($i = 1; $i -le $maxRetry; $i++) {
              echo "Attempt $i/${maxRetry}..."
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              try {
                $form = @{ file = Get-Item $filePath }
                Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases/${releaseId}/attach_files?access_token=${token}" `
                  -Method Post -Form $form
                $sw.Stop()
                echo "$fileName uploaded in $([math]::Round($sw.Elapsed.TotalSeconds, 1))s"
                $uploaded = $true
                break
              } catch {
                $sw.Stop()
                echo "Attempt $i failed after $([math]::Round($sw.Elapsed.TotalSeconds, 1))s: $($_.Exception.Message)"
                if ($i -lt $maxRetry) {
                  echo "Waiting 10 seconds before retry..."
                  Start-Sleep -Seconds 10
                }
              }
            }

            if (-not $uploaded) {
              if ($required) {
                echo "ERROR: Failed to upload $fileName after $maxRetry attempts"
                throw "Required upload failed: $fileName"
              } else {
                echo "WARNING: Failed to upload $fileName after $maxRetry attempts (optional, continuing)"
              }
            }
          }

          # 更新包：必须成功，重试10次
          echo "--- Step 2: Cleaning up old Gitee releases before upload ---"
          $keepReleaseCount = 3
          try {
            Remove-OldGiteeReleases $token $keepReleaseCount
          } catch {
            echo "ERROR cleaning up old Gitee releases before upload: $($_.Exception.Message)"
            echo "Response: $($_.ErrorDetails.Message)"
            throw
          }

          Upload-Asset "TypeSunny-${ver}-update.zip" $releaseId $token 10 $true

          # 全量包：可选，重试10次
          Upload-Asset "TypeSunny-${ver}-full.zip" $releaseId $token 10 $false

          echo "--- Step 3: Cleaning up old Gitee releases after upload ---"
          try {
            Remove-OldGiteeReleases $token $keepReleaseCount
          } catch {
            echo "ERROR cleaning up old Gitee releases after upload: $($_.Exception.Message)"
            echo "Response: $($_.ErrorDetails.Message)"
            throw
          }

          echo "=== Gitee Release Done ==="
