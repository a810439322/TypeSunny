name: Build and Release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore TypeSunny.sln

      - name: Build Release
        run: msbuild TypeSunny.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content "Version\version.txt" -Raw).Trim()
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Get commit message
        id: commit
        shell: pwsh
        run: |
          $msg = (git log -1 --pretty=%s)
          echo "message=$msg" >> $env:GITHUB_OUTPUT

      - name: Create packages
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"

          $fullZip = "TypeSunny-${ver}-full.zip"
          Compress-Archive -Path "bin\Release\*" -DestinationPath $fullZip -Force
          echo "Created $fullZip"

          $updateDir = "release-staging\update"
          New-Item -ItemType Directory -Path $updateDir -Force | Out-Null
          Get-ChildItem "bin\Release" -File | Where-Object {
            $_.Extension -in '.exe','.dll','.xml','.pdb','.config'
          } | Copy-Item -Destination $updateDir
          $updateZip = "TypeSunny-${ver}-update.zip"
          Compress-Archive -Path "$updateDir\*" -DestinationPath $updateZip -Force
          echo "Created $updateZip"

      - name: Delete existing GitHub release
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MSG="${{ steps.commit.outputs.message }}"
          gh release create "v${VERSION}" \
            --title "晴跟打 v${VERSION}" \
            --notes "${MSG}" \
            --target master \
            "TypeSunny-${VERSION}-full.zip" \
            "TypeSunny-${VERSION}-update.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8

          $ver = "${{ steps.version.outputs.version }}"
          $msg = "${{ steps.commit.outputs.message }}"
          $token = $env:GITEE_TOKEN

          echo "=== Gitee Release ==="
          echo "Version: $ver"
          echo "Message: $msg"
          echo "Token length: $($token.Length)"
          echo "Token prefix: $($token.Substring(0, [Math]::Min(4, $token.Length)))***"

          echo "--- Step 1: Creating release ---"
          $body = @{
            access_token = $token
            tag_name = "v$ver"
            name = "TypeSunny v$ver"
            body = $msg
            target_commitish = "master"
          } | ConvertTo-Json -Depth 3

          echo "Request body: $body"

          $utf8 = [System.Text.Encoding]::UTF8
          $bodyBytes = $utf8.GetBytes($body)

          try {
            $response = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases" `
              -Method Post -ContentType "application/json; charset=utf-8" `
              -Body $bodyBytes
            echo "Release created successfully"
          } catch {
            echo "ERROR creating release: $($_.Exception.Message)"
            echo "Response: $($_.ErrorDetails.Message)"
            throw
          }

          $releaseId = $response.id
          echo "Gitee Release ID: $releaseId"

          echo "--- Step 2: Uploading update zip ---"
          $zipFile = "TypeSunny-${ver}-update.zip"
          echo "Zip file: $zipFile"
          echo "Zip exists: $(Test-Path $zipFile)"
          echo "Zip size: $((Get-Item $zipFile).Length / 1MB) MB"

          $form = @{
            access_token = $token
            file = Get-Item $zipFile
          }

          try {
            Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/fuchuxuan/TypeSunny/releases/${releaseId}/attach_files" `
              -Method Post -Form $form
            echo "Upload completed"
          } catch {
            echo "ERROR uploading: $($_.Exception.Message)"
            echo "Response: $($_.ErrorDetails.Message)"
            throw
          }

          echo "=== Gitee Release Done ==="
